<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ゲーム iframe テンプレート（Phase 4）</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1rem; background: #111; color: #eee; }
    button { padding: 0.5rem 1rem; cursor: pointer; }
    #log { margin-top: 1rem; font-size: 12px; white-space: pre-wrap; color: #9ca3af; }
  </style>
</head>
<body>
  <h1>iframe ゲームテンプレ</h1>
  <p>親は同一オリジンのプラットフォームページ。解答は postMessage で送信し、親から CHECK_RESULT を受け取ってから演出する。</p>
  <label>解答 <input id="ans" type="text" placeholder="入力" /></label>
  <button type="button" id="send">SUBMIT_ANSWER を送る</button>
  <div id="log"></div>
  <script>
    (function () {
      var logEl = document.getElementById("log");
      function log(s) { logEl.textContent += s + "\n"; }

      window.addEventListener("message", function (ev) {
        if (ev.origin !== window.location.origin) return;
        var data = ev.data;
        if (!data || typeof data !== "object") return;
        if (data.type === "CHECK_RESULT") {
          log("親から: CHECK_RESULT correct=" + data.correct + " " + (data.message || ""));
        }
      });

      var qp = new URLSearchParams(window.location.search);
      var gameIdFromUrl = qp.get("gameId") || "demo-game";

      document.getElementById("send").onclick = function () {
        var v = document.getElementById("ans").value;
        if (!window.parent || window.parent === window) {
          log("親フレームなし（単体開き）");
          return;
        }
        window.parent.postMessage(
          {
            type: "SUBMIT_ANSWER",
            gameId: gameIdFromUrl,
            stageId: "mb-01-first-place",
            answer: v,
          },
          window.location.origin
        );
        log("送信: SUBMIT_ANSWER (stage=mb-01-first-place サンプル)");
      };
    })();
  </script>
</body>
</html>
